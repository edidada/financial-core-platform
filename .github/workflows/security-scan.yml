name: security-scan

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: '0 3 * * 1'

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }

      - name: OWASP Dependency-Check
        run: mvn -B -ntp org.owasp:dependency-check-maven:check -DskipTests
        continue-on-error: true

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify no plaintext credentials in repo
        run: |
          # 凭据只允许通过环境变量/Secret 注入；配置文件不得出现真实口令
          ! grep -rniE '(password|passwd|secret)\s*[:=]\s*["'"'"'][A-Za-z0-9!@#$%^&*]{6,}["'"'"']' \
            --include='*.yml' --include='*.yaml' --include='*.properties' \
            --include='*.xml' --include='*.java' . \
            | grep -v 'REPLACE_ME' | grep -v 'testpass' | grep -v '${' || true
