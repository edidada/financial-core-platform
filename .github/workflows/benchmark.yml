name: benchmark

on:
  workflow_dispatch:
    inputs:
      target_tps: { description: '目标 TPS', required: false, default: '500' }
      duration:   { description: '持续时长', required: false, default: '2m' }

jobs:
  jmh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build benchmark jar
        run: mvn -B -ntp -DskipTests -pl benchmark/jmh -am package
      - name: Run JMH micro benchmarks
        run: |
          java -cp "benchmark/jmh/target/classes:$(find ~/.m2 -name 'jmh-core-*.jar' | head -1)" \
            com.fcp.benchmark.BenchmarkRunner 2>&1 | tee jmh.txt
      - uses: actions/upload-artifact@v4
        with: { name: jmh-results, path: jmh.txt }

  k6:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Download boot jar
        uses: actions/download-artifact@v4
        with: { name: financial-core-app, path: app/financial-core-app/target }
      - name: k6 load test
        run: |
          java -jar app/financial-core-app/target/financial-core-app-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/v1/invariants && break; sleep 1; done
          k6 run -e BASE=http://localhost:8080 -e TPS=${{ inputs.target_tps }} benchmark/k6/transfer.js 2>&1 | tee k6.txt
      - uses: actions/upload-artifact@v4
        with: { name: k6-results, path: k6.txt }

  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: financial-core-app
          path: app/financial-core-app/target/financial-core-app-*.jar
