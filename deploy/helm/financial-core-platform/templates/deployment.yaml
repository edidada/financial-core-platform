apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  namespace: {{ .Release.Namespace }}
  labels: { app: {{ .Release.Name }}-app }
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-app }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-app }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: FCP_DB_PROFILE
              value: {{ .Values.database.profile | quote }}
            - name: FCP_SERVER_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: FCP_SHARDING_COUNT
              value: {{ .Values.sharding.count | quote }}
            - name: FCP_RATELIMIT_CAPACITY
              value: {{ .Values.rateLimit.capacity | quote }}
            - name: FCP_KAFKA_BOOTSTRAP
              value: {{ .Values.kafka.bootstrap | quote }}
            - name: FCP_WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          envFrom:
            - secretRef: { name: {{ .Values.database.existingSecret }} }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /v1/invariants, port: {{ .Values.service.targetPort }} }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/invariants, port: {{ .Values.service.targetPort }} }
            initialDelaySeconds: 45
            periodSeconds: 20
