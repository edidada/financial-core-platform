apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: fcp-app, namespace: fcp }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: fcp-app }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
