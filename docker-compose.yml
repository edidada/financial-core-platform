# 可选：本机已有 MySQL 8 时无需启动 mysql 服务；postgres 服务用于 postgresql profile 验证。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fcp
      POSTGRES_USER: ${FCP_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${FCP_DB_PASSWORD:-fcp_dev}
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8.0
    profiles: ["local-mysql"]
    environment:
      MYSQL_DATABASE: fcp
      MYSQL_ROOT_PASSWORD: ${FCP_DB_PASSWORD:-fcp_dev}
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci